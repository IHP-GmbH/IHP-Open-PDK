name: Python Code Linting

on:
  pull_request:
    paths:
      - 'ihp-*/libs.tech/klayout/tech/drc/**'
      - 'ihp-*/libs.tech/klayout/tech/lvs/**'
      - 'ihp-*/libs.tech/klayout/python/*_pycell_lib/**'
      - 'versions.txt'
      - 'requirements.txt'
      - '.flake8'
      - '.github/workflows/linting.yml'
  workflow_dispatch:

jobs:
  lint_python:
    runs-on: ubuntu-latest

    # One leg per PDK so a failure names the PDK it came from. The repo-wide
    # `make lint-all` still lints every ihp-* at once for local use.
    strategy:
      fail-fast: false
      matrix:
        pdk: [ihp-sg13g2, ihp-sg13cmos5l]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Lint with flake8
        run: |
          make lint_python PDK=${{ matrix.pdk }}
      - name: Check for non-ASCII characters in PCell libraries
        run: |
          SEARCH_ROOT="${{ matrix.pdk }}/libs.tech/klayout/python"
          DIRS=$(find "$SEARCH_ROOT" -mindepth 2 -maxdepth 2 -type d -path '*_pycell_lib/ihp')

          if [ -z "$DIRS" ]; then
            echo "ERROR: no '*_pycell_lib/ihp' directory found under '$SEARCH_ROOT'" >&2
            exit 1
          fi

          echo "$DIRS"

          MATCHES=$(echo "$DIRS" | xargs grep -rnP --include='*.py' '[^\x00-\x7F]' || true)

          if [ -n "$MATCHES" ]; then
            echo "ERROR: forbidden non-ASCII characters found in ${{ matrix.pdk }} PCell library:" >&2
            echo "$MATCHES" >&2
            exit 1
          fi
          echo "OK: no forbidden characters in ${{ matrix.pdk }} PCell library"

  klayout_version_consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check klayout pin in requirements.txt matches versions.txt
        run: |
          VERSIONS_TXT=$(grep '^klayout ' versions.txt | awk '{print $2}')
          REQ_LINE=$(grep '^klayout' requirements.txt | head -1)
          REQ_VERSION=$(echo "$REQ_LINE" | sed -nE 's/^klayout==([^[:space:]]+).*/\1/p')

          echo "versions.txt klayout: '$VERSIONS_TXT'"
          echo "requirements.txt klayout line: '$REQ_LINE'"
          echo "requirements.txt klayout version (pinned): '$REQ_VERSION'"

          if [ -z "$VERSIONS_TXT" ]; then
            echo "ERROR: versions.txt is missing a 'klayout <version>' line" >&2
            exit 1
          fi
          if [ -z "$REQ_VERSION" ]; then
            echo "ERROR: requirements.txt must pin klayout exactly as 'klayout==<version>'" >&2
            echo "       Current line: '$REQ_LINE'" >&2
            exit 1
          fi
          if [ "$VERSIONS_TXT" != "$REQ_VERSION" ]; then
            echo "ERROR: klayout version drift between versions.txt ($VERSIONS_TXT) and requirements.txt ($REQ_VERSION)" >&2
            echo "       Update both to the same value." >&2
            exit 1
          fi
          echo "OK: klayout version is consistent ($VERSIONS_TXT)"
