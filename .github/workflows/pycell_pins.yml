name: KLayout PCell Pin Regression

on:
  pull_request:
    paths:
      - 'ihp-*/libs.tech/klayout/python/**'
      - 'ihp-sg13g2/libs.tech/klayout/python/pycell4klayout-api'
      - 'ihp-sg13g2/libs.tech/klayout/python/pypreprocessor'
      - 'ihp-common/tests/klayout_pin_test.py'
      - 'ihp-common/pdk.mk'
      - 'Makefile'
      - 'requirements.txt'
      - 'versions.txt'
      - '.github/actions/setup-klayout/action.yml'
      - '.github/workflows/pycell_pins.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin_geometry:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pdk: [ihp-sg13g2, ihp-sg13cmos5l]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up KLayout
        uses: ./.github/actions/setup-klayout
      - name: Check pin geometry and connectivity
        run: make test-pycell-pins PDK=${{ matrix.pdk }}
