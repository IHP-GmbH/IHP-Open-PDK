name: Symlink Check

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No path filter: SG13CMOS5L reaches most of SG13G2 through relative symlinks,
# so moving or renaming a file anywhere in the repository can break one. The
# check takes seconds, so it runs on every pull request.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  broken_symlinks:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔗 Find broken symlinks
        run: |
          set -uo pipefail

          # Every broken symlink fails, with no exceptions. Note that some links
          # point at gitignored build products -- the *.osdi objects and the
          # Xyce *.so plugins that SG13CMOS5L borrows from SG13G2 -- and those
          # dangle until someone runs libs.tech/verilog-a/openvaf-compile-va.sh.
          # Keeping this check strict means such a link has to be resolved
          # rather than tolerated: build the objects ahead of this job, commit
          # them, or drop the link.
          find . -path ./.git -prune -o -type l -print0 \
            | xargs -0 -r file -N \
            | grep 'broken symbolic link' > broken.txt || true

          total=$(find . -path ./.git -prune -o -type l -print | wc -l)
          echo "Checked $total symlinks."

          if [ -s broken.txt ]; then
            echo "::error::Broken symlinks found:"
            cat broken.txt
            {
              echo "### Broken symlinks"
              echo ""
              echo '```'
              cat broken.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ No broken symlinks."
