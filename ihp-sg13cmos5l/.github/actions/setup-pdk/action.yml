name: Set up the SG13CMOS5L PDK
description: >
  Place a sibling ihp-sg13g2 checkout next to this one so the cross-PDK
  symlinks resolve, install the pinned KLayout, and assert the result is
  self-consistent before any regression runs.

runs:
  using: composite
  steps:
    # Most of this PDK is symlinked into ihp-sg13g2, six levels up from
    # libs.tech/klayout/tech/lvs/rule_decks, which lands on the directory
    # holding this checkout. So ihp-sg13g2 has to sit next to it, and this
    # repo has to live in a subdirectory rather than at the workspace root.
    - name: Read the pinned SG13G2 commit
      id: pin
      shell: bash
      run: |
        ref=$(grep -v '^#' ihp-sg13cmos5l/.github/ihp-sg13g2.ref | tr -d '[:space:]')
        if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error::.github/ihp-sg13g2.ref must hold one full 40-character commit SHA, got '$ref'"
          exit 1
        fi
        echo "Pinned SG13G2 commit: $ref"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"

    - name: Check out SG13G2
      uses: actions/checkout@v4
      with:
        repository: IHP-GmbH/IHP-Open-PDK
        ref: ${{ steps.pin.outputs.ref }}
        path: IHP-Open-PDK

    - name: Place SG13G2 next to this PDK
      shell: bash
      run: |
        ln -s IHP-Open-PDK/ihp-sg13g2 ihp-sg13g2
        # The Makefile installs from ../requirements.txt, i.e. the parent of
        # this checkout, which is where IHP-Open-PDK keeps it.
        ln -s IHP-Open-PDK/requirements.txt requirements.txt

    # Guard against the failure mode this layout invites: SG13G2 gains a rule
    # deck, includes it from one we symlink, and we have no symlink for it. The
    # run then dies on the first include with a message that names the file but
    # explains nothing (issue #64).
    #
    # Note this is not a dangling-symlink problem. The new deck has no symlink
    # at all, so there is nothing broken to find; only walking the includes
    # finds it. The find below is the complement, for links whose target moved.
    - name: Check every included rule deck exists
      shell: bash
      run: python3 ihp-sg13cmos5l/.github/check_includes.py ihp-sg13cmos5l

    # Scoped to the subtrees whose links point only at tracked files. Not all of
    # libs.tech: libs.tech/ngspice/osdi and libs.tech/xyce/plugins link at build
    # products that are gitignored in SG13G2, so they dangle in any checkout
    # until someone compiles them. Widening further needs those handled first.
    #
    # libs.tech/xyce/models is covered now that the stale resistors.lib link is
    # gone: SG13G2 split that file into resistors_mod/_parm/_stat.lib, which this
    # PDK already links separately, and nothing includes the old name.
    - name: Check the cross-PDK symlinks resolve
      shell: bash
      run: |
        broken=$(find ihp-sg13cmos5l/libs.tech/klayout \
                      ihp-sg13cmos5l/libs.tech/gnucap \
                      ihp-sg13cmos5l/libs.tech/verilog-a \
                      ihp-sg13cmos5l/libs.tech/xyce/models \
                      -type l -xtype l 2>/dev/null)
        if [ -n "$broken" ]; then
          echo "::error::Symlinks into ihp-sg13g2 do not resolve at the pinned commit."
          echo "$broken"
          echo "Either the pin in .github/ihp-sg13g2.ref is wrong, or SG13G2 moved"
          echo "files this PDK links to and the links need updating."
          exit 1
        fi
        echo "All checked symlinks resolve."

    - name: Read the pinned KLayout version
      id: klayout
      shell: bash
      run: |
        version=$(awk '/^klayout /{print $2}' ihp-sg13cmos5l/versions.txt)
        if [ -z "$version" ]; then
          echo "::error::No klayout entry in versions.txt"
          exit 1
        fi
        echo "Pinned KLayout version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore KLayout .deb from cache
      id: cache-klayout
      uses: actions/cache@v4
      with:
        path: klayout.deb
        key: klayout-deb-${{ steps.klayout.outputs.version }}

    - name: Install KLayout
      shell: bash
      run: |
        version="${{ steps.klayout.outputs.version }}"
        if [ ! -f klayout.deb ]; then
          echo "Downloading KLayout $version..."
          curl -L --retry 5 --retry-delay 5 --retry-all-errors -o klayout.deb \
            "https://www.klayout.org/downloads/Ubuntu-24/klayout_${version}-1_amd64.deb"
        fi
        sudo apt-get update -qq
        sudo apt-get install -y ./klayout.deb
        klayout -v

    # The decks reach KLayout two ways: run_drc.py shells out to the binary,
    # while run_lvs.py and the regression harnesses `import klayout.db` from the
    # venv, which pip installs from SG13G2's requirements.txt. Those are two
    # independent pins and nothing else compares them, so a run can silently
    # straddle two versions. Both version guards in the decks are floor checks
    # and cannot see it. Same assertion SG13G2 makes in its own CI.
    - name: Verify the binary and pip KLayout versions agree
      shell: bash
      working-directory: ihp-sg13cmos5l
      run: |
        make env
        expected="${{ steps.klayout.outputs.version }}"
        binary=$(klayout -b -v | tail -1 | awk '{print $NF}')
        pip_pkg=$(.venv/bin/python -c "import klayout; print(klayout.__version__)")
        echo "Expected (versions.txt):        $expected"
        echo "Binary   (klayout -b -v):       $binary"
        echo "Pip pkg  (klayout.__version__): $pip_pkg"
        fail=0
        if [ "$binary" != "$expected" ]; then
          echo "::error::klayout binary ($binary) does not match versions.txt ($expected)"
          fail=1
        fi
        if [ "$pip_pkg" != "$expected" ]; then
          echo "::error::klayout pip package ($pip_pkg) does not match versions.txt ($expected)."
          echo "It comes from SG13G2's requirements.txt at the commit in .github/ihp-sg13g2.ref,"
          echo "so bumping that pin can move it. Keep the two in step."
          fail=1
        fi
        exit $fail
