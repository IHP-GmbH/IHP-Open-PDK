name: DRC Regression Testing (CMOS5L)

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'libs.tech/klayout/tech/drc/**'
      - 'Makefile'
      - 'versions.txt'
      - '.github/ihp-sg13g2.ref'
      - '.github/check_includes.py'
      - '.github/actions/setup-pdk/action.yml'
      - '.github/workflows/drc_regression.yml'
  workflow_dispatch:

jobs:
  drc_regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ihp-sg13cmos5l

      - uses: ./ihp-sg13cmos5l/.github/actions/setup-pdk

      # Non-blocking on purpose: 9 of 179 rules already fail on main, see #65.
      # Running it anyway keeps that visible on every pull request instead of
      # hidden behind a workflow that never fires. Drop continue-on-error once
      # #65 is resolved.
      - name: Run KLayout DRC Regression
        continue-on-error: true
        working-directory: ihp-sg13cmos5l
        run: |
          make env
          make test-DRC-main

      - name: Run KLayout top-level DRC Deck
        working-directory: ihp-sg13cmos5l
        run: |
          klayout -b -r libs.tech/klayout/tech/drc/ihp-sg13cmos5l.drc \
            -rd run_mode=deep \
            -rd threads=1 \
            -rd no_feol=false \
            -rd no_beol=false \
            -rd no_offgrid=false \
            -rd no_pin=false \
            -rd no_forbidden=false \
            -rd input=libs.tech/klayout/tech/drc/testing/testcases/unit/activ.gds \
          || true
