name: LVS Regression Testing (CMOS5L)

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'libs.tech/klayout/tech/lvs/**'
      - 'Makefile'
      - 'versions.txt'
      - '.github/ihp-sg13g2.ref'
      - '.github/check_includes.py'
      - '.github/actions/setup-pdk/action.yml'
      - '.github/workflows/lvs_regression.yml'
  workflow_dispatch:

jobs:
  lvs_regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ihp-sg13cmos5l

      - uses: ./ihp-sg13cmos5l/.github/actions/setup-pdk

      - name: Run SG13CMOS5L KLayout LVS Regression
        working-directory: ihp-sg13cmos5l
        run: |
          make env
          make test-LVS-main

      # Kept separate from test-LVS-main because these cases are expected to
      # fail or to abort in extraction, so they cannot live in the unit
      # regression. Two of them guard the extraction error that a marker
      # without exactly two ports now raises, which comes from the G2 deck: if
      # a pin bump ever reverts it, this is what says so.
      - name: Run cap_cmomi LVS Checks for SG13CMOS5L
        working-directory: ihp-sg13cmos5l
        run: make test-LVS-cmomi-checks

      # The cap_cmomf counterpart, kept separate for the same reason. Two of its
      # cases guard behaviour a pin bump could take away: the terminal
      # equivalence, without which a mirrored placement is a mismatch, and the
      # marker split against cap_cmomi that keeps one geometry from extracting
      # as both devices.
      - name: Run cap_cmomf LVS Checks for SG13CMOS5L
        working-directory: ihp-sg13cmos5l
        run: make test-LVS-cmomf-checks

  lvs_regression_cells:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: ihp-sg13cmos5l

      - uses: ./ihp-sg13cmos5l/.github/actions/setup-pdk

      # Non-blocking on purpose: the four filler cells already fail on main,
      # see #67. The device-level lvs_regression job above stays blocking.
      # Drop continue-on-error once #67 is resolved.
      - name: Run LVS Regression for SG13CMOS5L Cells
        continue-on-error: true
        working-directory: ihp-sg13cmos5l
        run: |
          make env
          make test-LVS-cells
