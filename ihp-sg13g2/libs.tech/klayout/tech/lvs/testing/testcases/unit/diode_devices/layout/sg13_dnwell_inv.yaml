# Deep-nwell isolated inverter. Tap extraction must be disabled because the schematic
# carries no ntap1/ptap1 devices. This case does not rely on
# --ignore_top_ports_mismatch: the isolbox tub is biased to VDD through its contacted
# guard ring and resolves as a top-level port via isolbox_tie.
sg13_dnwell_inv:
  "--disable_tap_extraction": true
