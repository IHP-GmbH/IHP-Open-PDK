# Deep-nwell isolated NMOS (bulk tied to source). Tap extraction must be disabled so the
# isolated pwell ties to the source through the contact. --ignore_top_ports_mismatch is
# required because the isolation nwell ring is not biased to VDD and the VDD top port 
# does not resolve strictly.
test_ptap_dnw_ext:
  "--run_mode": deep
  "--disable_tap_extraction": true
  "--ignore_top_ports_mismatch": true
