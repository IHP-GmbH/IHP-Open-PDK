# HBT test structure npn13g2_T01: npn13g2, geometry from the file headers (Nx in REMARKS).
# Everything not set here comes from the device config (base_config): templates, metrics,
# MQA windows. Own result folder and own exception files, so its failures never mix with
# the device's main test structure.
# Not an MQA structure: the MQA (slides 3-4) lists only npn13g2_T03, npn13g2l_T01 and npn13g2v_T01,
# so this case is not part of test-all or the CI; it runs only on request (make test-<case>).
base_config: "configs/hbt/npn13g2/npn13g2.yaml"
mdm_dir: "../../../../libs.doc/meas/HBT/npn13g2_T01"
output_dir: "models_results/npn13g2_T01"
waivers_dir: "waivers/variants/npn13g2_T01"
sparam_waivers_dir: "waivers/variants/npn13g2_T01/sparam"

# This folder has two constant-VCB S-parameter files (no spar_vcb0 / vcb10 / vcbm05 and no
# copied S_deemb), so no self de-embedding; fT is checked on the MQA file only.
sparam_files:
  cje: spar_vb
  cjc: spar_vc
  ft: spar_vcb025      # the MQA file only (VCB = 0.25 V)
sparam_self_deembed: {}
