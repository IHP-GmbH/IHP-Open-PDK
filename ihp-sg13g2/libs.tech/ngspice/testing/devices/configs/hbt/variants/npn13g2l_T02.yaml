# HBT test structure npn13g2l_T02: npn13g2l, geometry from the file headers (Nx in REMARKS is right here).
# Everything not set here comes from the device config (base_config): templates, metrics,
# MQA windows. Own result folder and own exception files, so its failures never mix with
# the device's main test structure.
base_config: "configs/hbt/npn13g2l/npn13g2l.yaml"
mdm_dir: "../../../../libs.doc/meas/HBT/npn13g2l_T02"
output_dir: "models_results/npn13g2l_T02"
waivers_dir: "waivers/variants/npn13g2l_T02"
sparam_waivers_dir: "waivers/variants/npn13g2l_T02/sparam"

# The device config forces Nx=4 for T01; this structure uses its header value.
# Emitter length 5.0 um: outside the validity stated in the npn13G2l model card
# (sg13g2_hbt_mod.lib: El = 1 - 2.5 um), so its failures include extrapolation of the model.
design_param_overrides: {}
