# HBT test structure npn13g2v_T00: npn13g2v, geometry from the file headers (Nx in REMARKS).
# Everything not set here comes from the device config (base_config): templates, metrics,
# MQA windows. Own result folder and own exception files, so its failures never mix with
# the device's main test structure.
# Not an MQA structure: the MQA (slides 3-4) lists only npn13g2_T03, npn13g2l_T01 and npn13g2v_T01,
# so this case is not part of test-all or the CI; it runs only on request (make test-<case>).
base_config: "configs/hbt/npn13g2v/npn13g2v.yaml"
mdm_dir: "../../../../libs.doc/meas/HBT/npn13g2v_T00"
output_dir: "models_results/npn13g2v_T00"
waivers_dir: "waivers/variants/npn13g2v_T00"
sparam_waivers_dir: "waivers/variants/npn13g2v_T00/sparam"

# This folder has no spar_vcb05, the MQA fT file of the device (MQA slides 4 and 12), so fT is
# not checked here: the HBTs are checked only on the MQA characteristics (mqa_ranges_only).
# The plain spar_vcb10 has fT ~110 GHz (the VCB = 0.5 V value) and a de-embedded/raw fT ratio of
# 1.01-1.08 instead of ~1.10, i.e. its S_deemb looks copied (kept as a data finding).
sparam_files:
  cje: spar_vb
  cjc: spar_vc
sparam_copied_deemb: [spar_vcb10]
sparam_metrics:           # no fT: these structures have no spar_vcb05, the MQA fT file of npn13g2v
  - {name: cje, meas: cje_meas, tt: cje_sim_hbt_typ, ss: cje_sim_hbt_bcs, ff: cje_sim_hbt_Wcs}
  - {name: cjc, meas: cjc_meas, tt: cjc_sim_hbt_typ, ss: cjc_sim_hbt_bcs, ff: cjc_sim_hbt_Wcs}
