# ==============================================================
# PDK Models Setup
# ==============================================================
# Define the paths to measurement data and PDK model libraries
# ==============================================================

# Path to measured device model directory (raw measurement data)
mdm_dir: "../../../../libs.doc/meas/MOS/SG13_pmosXm1Y3"

# Path to the PDK-provided model library (corner definitions)
corner_lib_path: "../../../../libs.tech/ngspice/models/cornerMOSlv.lib"

# Compiled PSP103 model of the selected toolchain (`make osdi`, tools/toolchain.py): the Makefile
# exports OSDI_DIR, and .spiceinit loads psp103.osdi / psp103_nqs.osdi from there. Its presence
# also marks the device as using a Verilog-A model (exceptions are kept per full toolchain ID).
osdi_path: "${OSDI_DIR}/psp103.osdi"

# ==============================================================
# Device Configuration
# ==============================================================
# Specify device type and name to clearly identify which
# transistor or component this configuration applies to
# ==============================================================

# Device category (e.g. hbt, mos, resistor, capacitor, etc.)
device_type: "mos"

# Specific device name inside the PDK
device_name: "sg13_lv_pmos"

# ==============================================================
# Run Configuration
# ==============================================================
# Control how simulations are run and how many resources are used
# ==============================================================

# Path to the DC analysis template (Jinja2 format)
dc_template_path: "configs/mos/dc_template.spice.j2"

# Templates for measurement groups that need another circuit than the transistor sweep:
# the junction-diode structures (one junction only; see the template's header).
setup_templates:
  di_bd_area: "configs/mos/diode_template.spice.j2"
  di_bd_perim: "configs/mos/diode_template.spice.j2"
  di_bs_area: "configs/mos/diode_template.spice.j2"
  di_bs_perim: "configs/mos/diode_template.spice.j2"

# Maximum number of workers (parallel jobs).
# Set based on your system CPU cores.
max_workers: 8

# ==============================================================
# Output and Validation Settings
# ==============================================================

# ----------------------------------------------------
# Validation Threshold Configuration
# ----------------------------------------------------
# threshold_percent_oob defines the **maximum allowed percentage (%) of points**
# that can fall **outside the valid model envelope** (out-of-bound, OOB)
# for each sweep or test condition.
#
# This parameter controls the overall pass/fail criteria for each dataset:
# - If the fraction of OOB points ≤ threshold → the sweep passes.
# - If the fraction of OOB points > threshold → the sweep fails.
#
# Example:
#   Total sweep points = 200
#   Out-of-bound points = 1
#   threshold_percent_oob = 0.5
#
#   (1 / 200) × 100 = 0.5% <= 5% → PASS
#
#   If 2 points were out of bounds → (1%) > 0.5% → FAIL

threshold_percent_oob: 0.5

# ----------------------------------------------------
# Corner Envelope Tolerance Configuration
# ----------------------------------------------------
# corner_tolerance_percent defines the **relative tolerance percentage**
# added to the FF/SS simulation envelopes to account for expected
# statistical process variation (based on σ-level confidence).
#
# The value represents the percentage of samples expected to fall
# *outside* the FF/SS limits for a given σ coverage:
#
#   - 1σ → 100 - 68.27 = 31.73%
#   - 2σ → 100 - 95.45 = 4.55%
#   - 3σ → 100 - 99.73 = 0.27%
#   - 4σ → 100 - 99.9937 = 0.0063%
#   - 5σ → 100 - 99.99994 = 0.00006%
#   - 6σ → 100 - 99.9999998 = 0.0000002%
#
# Example:
#   If corner_tolerance_percent = 0.27
#   - Effective FF bound = FF_sim_value × (1 + 0.0027)
#   - Effective SS bound = SS_sim_value × (1 - 0.0027)
#
# This means the FF and SS bounds are extended by ±0.27% of their values.
#
corner_tolerance_percent: 0.27

# ----------------------------------------------------
# Current Clipping Configuration
# ----------------------------------------------------
# clip_curr sets the minimum current level (in Amperes) below which
# current measurements are ignored during validation.
# This helps avoid false OOB flags due to noise in very low current regions.

clip_curr: 1e-11   # A

# ==============================================================
# Metrics Definitions
# ==============================================================
# Naming convention:
#   *_meas = measured value
#   *_sim_* = simulated values (typ/bcs/Wcs = corners)
# ==============================================================

metrics:
  - name: "id"   # Drain current
    meas: "id_meas"
    tt: "id_sim_mos_tt"
    ss: "id_sim_mos_ss"
    ff: "id_sim_mos_ff"

  - name: "is"   # Source current
    meas: "is_meas"
    tt: "is_sim_mos_tt"
    ss: "is_sim_mos_ss"
    ff: "is_sim_mos_ff"

  - name: "ib"   # Bulk (body) current
    meas: "ib_meas"
    tt: "ib_sim_mos_tt"
    ss: "ib_sim_mos_ss"
    ff: "ib_sim_mos_ff"

  - name: "ig"   # Gate current
    meas: "ig_meas"
    tt: "ig_sim_mos_tt"
    ss: "ig_sim_mos_ss"
    ff: "ig_sim_mos_ff"

# ==============================================================
# C-V tier (make test-<case>-cv): capacitance-meter measurements
# ==============================================================
# Simulated with one AC analysis at cv_freq_hz per bias point (models_verifier/cv_runner/);
# judged with the normal check (ss..ff band + corner_tolerance_percent, threshold_percent_oob).
# Results go to <output_dir>/cv/, exceptions to waivers/cv/.
cv_template_path: "configs/mos/cv_template.spice.j2"
cv_subckt_pins: [d, g, s, b]          # pin order of the PDK subcircuit
cv_freq_hz: 1.0e6                     # not recorded in the files; PSP103 gives the same C at 0.1-10 MHz

# Meter terminals per measurement group (high: bias + AC; low: AC current read; other pins AC
# ground). Taken from the headers and confirmed by simulation:
#   c_bd_* / c_bs_*  the header COMMENT says "S/D-Low", but counting S as well doubles C: only the
#                    junction of the group (D or S) is the meter input.
#   c_d_g            PIN_H "15+5": S/D and B are driven together with the vd sweep, G is LOW.
#   c_oxide          the sweep value is V(B) - V(G); the structure has no S/D contacts, so S/D
#                    are floating for AC and follow B for DC.
cv_setups:
  c_bd_area:  {high: [b], low: [d]}
  c_bd_perim: {high: [b], low: [d]}
  c_bs_area:  {high: [b], low: [s]}
  c_bs_perim: {high: [b], low: [s]}
  c_g_ds:     {high: [g], low: [d, s]}
  c_g_dsb:    {high: [g], low: [d, s, b]}
  c_d_g:      {high: [d, s, b], low: [g]}
  c_oxide:    {high: [b], low: [g], float: [d, s], float_to: b}
cv_metrics:
  - {name: cbd,    meas: cbd_meas,    tt: cbd_sim_mos_tt,    ss: cbd_sim_mos_ss,    ff: cbd_sim_mos_ff}
  - {name: cbs,    meas: cbs_meas,    tt: cbs_sim_mos_tt,    ss: cbs_sim_mos_ss,    ff: cbs_sim_mos_ff}
  - {name: cg_sd,  meas: cg_sd_meas,  tt: cg_sd_sim_mos_tt,  ss: cg_sd_sim_mos_ss,  ff: cg_sd_sim_mos_ff}
  - {name: cg_sdb, meas: cg_sdb_meas, tt: cg_sdb_sim_mos_tt, ss: cg_sdb_sim_mos_ss, ff: cg_sdb_sim_mos_ff}
  - {name: cd_g,   meas: cd_g_meas,   tt: cd_g_sim_mos_tt,   ss: cd_g_sim_mos_ss,   ff: cd_g_sim_mos_ff}
  - {name: cox,    meas: cox_meas,    tt: cox_sim_mos_tt,    ss: cox_sim_mos_ss,    ff: cox_sim_mos_ff}

# Header corrections (per file-name substring). The gate C-V headers of these structures say
# L = 250 nm; with it the simulation of Cgds1/Cgdsb1 is 2.05x and of Cgds3/Cgdsb3 0.025x the
# measurement (measurement / simulation 0.49 and ~40). With the
# lengths of the matching Cbdsg1/Cbdsg3 structures (130 nm / 10 um) all four agree within
# 0.86-1.15, so the headers are taken as wrong (same structures as Cbdsg1/3).
cv_file_overrides:
  Cgds1_S351B_11: {L: 130.0e-9}
  Cgdsb1_S351B_11: {L: 130.0e-9}
  Cgds3_S351B_13: {L: 10.0e-6}
  Cgdsb3_S351B_13: {L: 10.0e-6}
cv_waivers_dir: "waivers/cv"

# ==============================================================
# Output Paths
# ==============================================================
# Directory where processed results will be stored
# ==============================================================

output_dir: "models_results/pmos_lv"
